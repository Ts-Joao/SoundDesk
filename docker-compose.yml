services:
  postgres:
    image: postgres:17
    container_name: sound_postgres
    restart: always

    environment:
      - POSTGRES_DB=sounddb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: sound_redis
    restart: always

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: sound_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    container_name: sound_worker
    command: celery -A app.workers.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: sound_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
